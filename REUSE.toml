version = 1

# Documentation, data and repository metadata: the files that cannot carry a header of their own, or where
# a comment line would be read as content. The firmware and the scripts carry SPDX headers instead.
[[annotations]]
path = [
  "README.md",
  "docs/**",
  "data/**",
  "PROJECT.yml",
  ".gitignore",
  ".gitattributes",
  "firmware/.gitignore",
  "firmware/espnow-rssi/.gitignore",
  "REUSE.toml",
]
SPDX-FileCopyrightText = "2026 Alon A. Rabinowitz"
SPDX-License-Identifier = "CC-BY-4.0"
