version = 1

# Documentation, data and repository metadata: the files that cannot carry a header of their own, or where
# a comment line would be read as content. The firmware, the scripts and the models carry SPDX headers instead.
[[annotations]]
path = [
  "README.md",
  "CLAUDE.md",
  "docs/**",
  "data/**",
  "models/**/README.md",
  "sim/**/README.md",
  "sim/**/uv.lock",
  "PROJECT.yml",
  ".gitignore",
  ".gitattributes",
  ".gitmodules",
  "firmware/.gitignore",
  "firmware/espnow-rssi/.gitignore",
  "REUSE.toml",
]
SPDX-FileCopyrightText = "2026 Alon A. Rabinowitz"
SPDX-License-Identifier = "CC-BY-4.0"

# The LunchBox remix's pictures render the remix, and with it GekoPrime's LunchBox, which is CC BY-SA 4.0:
# they share its licence. A later annotation wins over an earlier one for the files both match.
[[annotations]]
path = "docs/lunchbox/**"
SPDX-FileCopyrightText = ["2026 Alon A. Rabinowitz", "GekoPrime (LunchBox, https://www.printables.com/model/468166)"]
SPDX-License-Identifier = "CC-BY-SA-4.0"
